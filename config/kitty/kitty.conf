# kitty.conf — terminal do rice. Instalado em ~/.config/kitty/kitty.conf; as cores do wallpaper
# entram por um include no fim (adicionado pelo install.py) e mudam ao vivo (o theme.py manda SIGUSR1).
# Rice minimal; managed copy in ~/Projetos/rice-minimal
font_family JetBrainsMono Nerd Font Mono
font_size 11
background #111111
foreground #ddddcc
# Fundo 85% opaco (o LW usa a mesma transparência).
background_opacity 0.85
cursor_shape block
cursor_blink_interval 0
cursor_trail 0
window_padding_width 8
enable_audio_bell no

# Fecha janelas e abas sem perguntar, mesmo com um programa rodando.
confirm_os_window_close 0
